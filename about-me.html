(function initClickSpark(){
  const cv = document.createElement('canvas');
  cv.id = 'sparkCanvas';
  document.body.appendChild(cv);
  const ctx = cv.getContext('2d');
  let sparks = [];
  const SIZE = 12, RADIUS = 18, COUNT = 8, DUR = 500;

  const resize = () => {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  };
  resize();
  addEventListener('resize', resize);

  const COLORS = { home: '#ffffff', projects: '#14141a', activity: '#F5E7D8', contact: '#ffffff' };
  const ease = t => t * (2 - t);

  addEventListener('pointerdown', e => {
    const now = performance.now();
    const col = COLORS[document.body.dataset.page] || '#ffffff';
    for(let i = 0; i < COUNT; i++){
      sparks.push({ x: e.clientX, y: e.clientY, angle: (2 * Math.PI * i) / COUNT, t0: now, col });
    }
    kick();
  });
})();

  let raf = null;
  const kick = () => { if(raf === null) raf = requestAnimationFrame(draw); };

  function draw(now){
    raf = null;
    ctx.clearRect(0, 0, cv.width, cv.height);
    sparks = sparks.filter(s => {
      const el = now - s.t0;
      if(el >= DUR) return false;
      const e2 = ease(el / DUR);
      const d = e2 * RADIUS;
      const len = SIZE * (1 - e2);
      const x1 = s.x + d * Math.cos(s.angle);
      const y1 = s.y + d * Math.sin(s.angle);
      const x2 = s.x + (d + len) * Math.cos(s.angle);
      const y2 = s.y + (d + len) * Math.sin(s.angle);
      ctx.strokeStyle = s.col;
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(x1, y1);
      ctx.lineTo(x2, y2);
      ctx.stroke();
      return true;
    });
    if(sparks.length) kick();          // berhenti total kalau tak ada percikan
  }

/* Pecah teks jadi span per-huruf (word-wrap tetap terjaga) untuk efek proximity */
function proxWrap(el, text, base){
  if(MOBILE){ el.textContent = String(text); return; }   // HP: teks polos
  el.textContent = '';
  const words = String(text).split(' ');
  words.forEach((w, wi) => {
    const wspan = document.createElement('span');
    wspan.style.display = 'inline-block';
    wspan.style.whiteSpace = 'nowrap';
    for(const ch of w){
      const s = document.createElement('span');
      s.className = 'prox';
      s.style.display = 'inline-block';
      s.dataset.base = base;
      s.textContent = ch;
      wspan.appendChild(s);
    }
    el.appendChild(wspan);
    if(wi < words.length - 1) el.appendChild(document.createTextNode(' '));
  });
}

/* Loop: tiap huruf yang dekat kursor berat font-nya naik menuju 900 */
function startProximity(root){
  if(MOBILE) return;                       // HP: tanpa efek hover tebal
  const myTok = proxToken;
  const RADIUS = 130;
  const cursor = { x: -9999, y: -9999 };
  let cache = [];
  const recompute = () => {
    cache = [];
    root.querySelectorAll('.prox').forEach(el => {
      const r = el.getBoundingClientRect();
      const base = +el.dataset.base || 400;
      cache.push({ el, cx: r.left + r.width/2, cy: r.top + r.height/2, base, w: base });
    });
  };
  root._proxRecompute = recompute;
  let moved = true, lastMove = 0;
  const mm = e => { cursor.x = e.clientX; cursor.y = e.clientY; moved = true; lastMove = performance.now(); };
  const rs = () => { recompute(); moved = true; };
  window.addEventListener('mousemove', mm, { passive: true });
  window.addEventListener('resize', rs);
  recompute();

  (function loop(){
    const dead = (myTok !== proxToken) || (cache.length && !cache[0].el.isConnected);
    if(dead){
      window.removeEventListener('mousemove', mm);
      window.removeEventListener('resize', rs);
      return;
    }
    if(!window.__layerLive(cache.length ? cache[0].el : root)){
      requestAnimationFrame(loop);
      return;
    }

    // Kursor diam & semua huruf sudah pada bobotnya → TIDAK ada pekerjaan sama sekali.
    // (Dulu: 60×/detik menghitung jarak ke SEMUA huruf + menulis style → forced reflow.)
    if(!moved){
      requestAnimationFrame(loop);
      return;
    }
    moved = false;

    const R = RADIUS, R2 = R * R;
    const cx = cursor.x, cy = cursor.y;
    for(let i = 0; i < cache.length; i++){
      const L = cache[i];
      const dx = cx - L.cx;
      if(dx > R || dx < -R){                      // buang cepat: di luar kotak
        if(L.w !== L.base){ L.w = L.base; L.el.style.fontVariationSettings = `'wght' ${L.base}`; }
        continue;
      }
      const dy = cy - L.cy;
      if(dy > R || dy < -R){
        if(L.w !== L.base){ L.w = L.base; L.el.style.fontVariationSettings = `'wght' ${L.base}`; }
        continue;
      }
      const d2 = dx*dx + dy*dy;                   // tanpa akar kuadrat
      let w = L.base;
      if(d2 < R2){
        const t = Math.pow(1 - Math.sqrt(d2) / R, 0.55);
        w = (L.base + (900 - L.base) * t) | 0;
      }
      w = w - (w % 8);                            // dibulatkan → tulis style jauh lebih jarang
      if(w !== L.w){
        L.w = w;
        L.el.style.fontVariationSettings = `'wght' ${w}`;
      }
    }
    requestAnimationFrame(loop);
  })();
}

function initActivity(root){
  const items = CONFIG.activity.items;
  const isBase = true;   // semua layer (termasuk 'intip') di-init penuh
  const stackEl = root.querySelector('#actStackRoot');
  const capPlaceEl = root.querySelector('#actCapPlace');
  const capTitleEl = root.querySelector('#actCapTitle');

  // label yang dianggap "lokasi" di meta kegiatan → dipakai sebagai caption "tempat" di kartu foto
  const LOC_KEYS = ['location','lokasi','tempat','venue'];
  function setText(i){
    const it = items[i];
    const meta = it.meta || [];
    const locM = meta.find(m => LOC_KEYS.includes((m.k||'').toLowerCase()));
    if(capPlaceEl) capPlaceEl.textContent = locM ? locM.v : (it.cat || '');
    if(capTitleEl) capTitleEl.textContent = it.title;
  }

  const imagesPerItem = activityImagesPerItem();
  const startIdx = ((window.__activityTopId || 1) - 1 + items.length) % items.length;
  setText(startIdx);

  window.__revalidateStack = (el) => {
    if(window.__mountActivityStack) window.__mountActivityStack(el, activityImagesPerItem(), (topId) => setText((topId - 1 + items.length) % items.length));
  };

  if(isBase && window.__mountActivityStack){
    startProximity(root);
    // Stack React persisten dipindah ke sini (instan). Swipe=ganti projek, tap=ganti gambar.
    window.__mountActivityStack(stackEl, imagesPerItem, (topId) => setText((topId - 1 + items.length) % items.length));

    // Tekan gambar (tanpa geser) → buka detail + semua gambarnya
    if(stackEl){
      let px = 0, py = 0, drag = false;
      stackEl.addEventListener('pointerdown', e => { px = e.clientX; py = e.clientY; drag = false; });
      stackEl.addEventListener('pointermove', e => {
        if(Math.hypot(e.clientX - px, e.clientY - py) > 6) drag = true;
      });
      stackEl.addEventListener('pointerup', () => {
        if(drag) return;
        const i = ((window.__activityTopId || 1) - 1 + items.length) % items.length;
        const it = items[i];
        if(!it) return;
        openModal({
          title: it.title,
          desc: it.text,
          images: imagesPerItem[i] || [],
          palette: { bg:'#3a0f08', fg:'#7FE39A' },
          theme: 'act'
        });
      });
    }
  } else if(stackEl){
    // Sliver / fallback: gambar utama statis
    stackEl.innerHTML = '';
    const im = document.createElement('img');
    im.className = 'act-stack-static'; im.src = imagesPerItem[startIdx][0]; im.alt = '';
    stackEl.appendChild(im);
    // Home tidak memakai bold hover lagi (desain baru + jauh lebih ringan)
  }

  initAboutMeSections(root);
}

/* =====================================================================
   ABOUT ME — section tambahan di bawah hero (marquee, skills, pin board,
   certificates carousel, footer CTA). Data dari CONFIG.activity.items,
   CONFIG.activity.skills, dan CONFIG.projects.certificates (sudah ada).
   ===================================================================== */
function initAboutMeSections(root){
  const items = CONFIG.activity.items || [];
  const skills = CONFIG.activity.skills || [];
  const certs = CONFIG.projects.certificates || [];

  /* ---- Marquee (dua pita, isi statis) ---- */
  const marqWords = ["Embedded Systems","Internet of Things","Web Development","Machine Learning","Research"];
  const marqSpans = marqWords.concat(marqWords).map(w => `<span>${esc(w)}</span>`).join('');
  const topMarq = root.querySelector('#amMarqTop');
  if(topMarq) topMarq.innerHTML = marqSpans;
  const botMarq = root.querySelector('#amMarqBottom');
  if(botMarq) botMarq.innerHTML = Array(10).fill('<span>My Certificates</span>').join('');

  /* ---- Skills: What I Do ---- */
  const skillsGrid = root.querySelector('#amSkillsGrid');
  if(skillsGrid){
    skillsGrid.innerHTML = skills.map((s,i) => `
      <div class="am-skill">
        <div class="am-skill-photo" style="${s.photo ? `background-image:url('${img(s.photo,s.title,'#2a3a24','#F5E7D8',420,300)}')` : ''}"></div>
        <div class="am-skill-glass">
          <div class="am-skill-n">0${i+1}</div>
          <div class="am-skill-body">
            <h4>${esc(s.title)}</h4>
            <div class="am-tags">${(s.tags||[]).map(t => `<span>${esc(t)}</span>`).join('')}</div>
          </div>
        </div>
      </div>`).join('');
  }
  const skillsCount = root.querySelector('#amSkillsCount');
  if(skillsCount) skillsCount.textContent = `${skills.length} area${skills.length===1?'':'s'}`;

  /* ---- Journey & Achievements: papan pin ---- */
  const pinsGrid = root.querySelector('#amPinsGrid');
  if(pinsGrid){
    pinsGrid.innerHTML = items.map((it,i) => `
      <article class="am-pin" data-i="${i}">
        <img class="am-pin-img" src="${img(it.photo,it.title,'#2a3a24','#F5E7D8',420,300)}" alt="" loading="lazy">
        <div class="am-pin-body">
          <div class="am-pin-cat">${esc(it.cat || 'Activity')}</div>
          <div class="am-pin-title">${esc(it.title)}</div>
          <div class="am-pin-desc">${esc(it.text)}</div>
          ${it.year ? `<span class="am-pin-year">${esc(it.year)}</span>` : ''}
        </div>
      </article>`).join('');
    // klik satu pin → seluruh baris yang sama ikut expand (deskripsi tampil)
    pinsGrid.querySelectorAll('.am-pin').forEach(pin => {
      pin.addEventListener('click', () => {
        const visible = Array.from(pinsGrid.querySelectorAll('.am-pin')).filter(p => p.offsetParent !== null);
        const colCount = getComputedStyle(pinsGrid).gridTemplateColumns.split(' ').filter(Boolean).length || 3;
        const idx = visible.indexOf(pin);
        const rowStart = idx - (idx % colCount);
        const row = visible.slice(rowStart, rowStart + colCount);
        const willActivate = !pin.classList.contains('active');
        row.forEach(p => p.classList.toggle('active', willActivate));
      });
    });
  }
  const activityCount = root.querySelector('#amActivityCount');
  if(activityCount){
    const years = items.map(it => parseInt(it.year,10)).filter(n => !isNaN(n));
    const minYear = years.length ? Math.min(...years) : new Date().getFullYear();
    activityCount.textContent = `${items.length} activit${items.length===1?'y':'ies'} · ${minYear} — ${new Date().getFullYear()}`;
  }
  const pinsSeeMore = root.querySelector('#amPinsSeeMore');
  if(pinsSeeMore){
    pinsSeeMore.addEventListener('click', (e) => {
      e.preventDefault();
      pinsGrid.classList.toggle('expanded');
      pinsSeeMore.textContent = pinsGrid.classList.contains('expanded') ? 'See less ←' : 'See more →';
    });
  }

  /* ---- Certificates: carousel loop ---- */
  const certsTrack = root.querySelector('#amCertsTrack');
  const certsViewport = root.querySelector('#amCertsViewport');
  const certsSeeAll = root.querySelector('#amCertsSeeAll');
  const certsCount = root.querySelector('#amCertsCount');
  if(certsCount) certsCount.textContent = `${certs.length} certificate${certs.length===1?'':'s'}`;
  if(certsTrack && certs.length){
    const certCard = (ct,i) => `
      <div class="am-cert" data-i="${i}">
        <img class="am-cert-img" src="${img(ct.image,ct.title,'#2a3a24','#F5E7D8',300,220)}" alt="" loading="lazy">
        <div class="am-cert-body">
          <div class="am-cert-title">${esc(ct.title)}</div>
          <div class="am-cert-issuer">${esc(ct.issuer||'')}</div>
        </div>
      </div>`;
    const single = certs.map(certCard).join('');
    certsTrack.innerHTML = single + single + single;   // 3x duplikat → loop tak berujung

    const cards = Array.from(certsTrack.children);
    const setLen = cards.length / 3;
    const setWidth = () => cards[setLen] ? (cards[setLen].offsetLeft - cards[0].offsetLeft) : 0;
    let sw = setWidth();
    certsTrack.scrollLeft = sw;

    const updateOpacity = () => {
      if(certsTrack.classList.contains('expanded')) return;
      const rect = certsTrack.getBoundingClientRect();
      const center = rect.left + rect.width / 2;
      cards.forEach(card => {
        const cr = card.getBoundingClientRect();
        const dist = Math.abs(center - (cr.left + cr.width / 2));
        const norm = Math.min(dist / (rect.width / 2), 1);
        card.style.opacity = String(1 - norm * 0.6);
      });
    };
    const handleLoop = () => {
      if(certsTrack.classList.contains('expanded')) return;
      sw = setWidth();
      if(certsTrack.scrollLeft < sw * 0.5) certsTrack.scrollLeft += sw;
      else if(certsTrack.scrollLeft > sw * 1.5) certsTrack.scrollLeft -= sw;
    };
    let ticking = false;
    certsTrack.addEventListener('scroll', () => {
      if(!ticking){ requestAnimationFrame(() => { updateOpacity(); handleLoop(); ticking = false; }); ticking = true; }
    }, { passive:true });

    if(certsSeeAll){
      certsSeeAll.addEventListener('click', () => {
        const isExpanded = certsTrack.classList.toggle('expanded');
        if(certsViewport) certsViewport.classList.toggle('expanded', isExpanded);
        certsSeeAll.textContent = isExpanded ? 'See less' : 'See all';
        if(!isExpanded){ sw = setWidth(); certsTrack.scrollLeft = sw; updateOpacity(); }
      });
    }

    // klik satu kartu → detail (reuse openModal, tema sama seperti sertifikat di halaman Projects)
    certsTrack.querySelectorAll('.am-cert').forEach(card => {
      let moved = false, sx = 0;
      card.addEventListener('pointerdown', e => { moved = false; sx = e.clientX; });
      card.addEventListener('pointermove', e => { if(Math.abs(e.clientX - sx) > 6) moved = true; });
      card.addEventListener('click', () => {
        if(moved) return;
        const ct = certs[+card.dataset.i];
        if(!ct) return;
        openModal({ title:ct.title, desc:(ct.issuer?('Issued by '+ct.issuer):''), images:[ct.image], link:ct.url, palette:{ bg:'#3a0f08', fg:'#7FE39A' }, theme:'act' });
      });
    });

    // drag-to-scroll pakai mouse
    let isDown = false, startX = 0, startScroll = 0;
    certsTrack.addEventListener('pointerdown', e => {
      if(e.pointerType !== 'mouse' || certsTrack.classList.contains('expanded')) return;
      isDown = true; startX = e.clientX; startScroll = certsTrack.scrollLeft;
      certsTrack.classList.add('dragging'); certsTrack.setPointerCapture(e.pointerId);
    });
    certsTrack.addEventListener('pointermove', e => {
      if(!isDown || e.pointerType !== 'mouse') return;
      certsTrack.scrollLeft = startScroll - (e.clientX - startX);
    });
    const endDrag = () => { isDown = false; certsTrack.classList.remove('dragging'); };
    certsTrack.addEventListener('pointerup', endDrag);
    certsTrack.addEventListener('pointercancel', endDrag);
    certsTrack.addEventListener('wheel', e => {
      if(certsTrack.classList.contains('expanded')) return;
      if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ certsTrack.scrollLeft += e.deltaY; e.preventDefault(); }
    }, { passive:false });

    window.addEventListener('resize', () => {
      if(certsTrack.classList.contains('expanded')) return;
      sw = setWidth();
      if(sw) certsTrack.scrollLeft = sw + (certsTrack.scrollLeft % sw);
      updateOpacity();
    });

    updateOpacity();
  }

  /* ---- Footer CTA → halaman Contact ---- */
  const footCta = root.querySelector('#amFootCta');
  if(footCta){
    footCta.addEventListener('click', (e) => {
      e.preventDefault();
      if(window.__goPage) window.__goPage('contact');
    });
  }
}

function initContact(root){
  const form = root.querySelector('#contactForm');
  const note = root.querySelector('#cf-note');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = form.querySelector('.send');
    const lbl = btn.querySelector('span');
    const data = { name: form.name.value.trim(), email: form.email.value.trim(), message: form.message.value.trim() };
    if(!data.message){ note.textContent = "Please write a message."; note.className = "note err"; return; }

    // 1) Web3Forms → email langsung ke Gmail (tanpa buka aplikasi email; boleh anonim)
    const key = (CONFIG.contact.web3formsKey || "").trim();
    if(key){
      try {
        btn.disabled = true; if(lbl) lbl.textContent = "Sending…";
        const payload = {
          access_key: key,
          subject: `Portfolio message${data.name ? ' from ' + data.name : ''}`,
          from_name: data.name || "Anonymous",
          name: data.name || "Anonymous",
          message: data.message
        };
        if(data.email) payload.email = data.email;   // hanya jika diisi (biar bisa anonim)
        const res = await fetch("https://api.web3forms.com/submit", {
          method:"POST", headers:{ "Content-Type":"application/json", "Accept":"application/json" },
          body: JSON.stringify(payload)
        });
        const j = await res.json().catch(() => ({}));
        if(j.success){ form.reset(); note.textContent = "Thanks — your message is on its way!"; note.className = "note ok"; }
        else { note.textContent = "Something went wrong. Please try again."; note.className = "note err"; }
      } catch { note.textContent = "Network error. Please try again."; note.className = "note err"; }
      finally { btn.disabled = false; if(lbl) lbl.textContent = "Send"; }
      return;
    }

    const endpoint = CONFIG.contact.formEndpoint;
    if(!endpoint || !endpoint.trim()){
      const subject = encodeURIComponent(`Portfolio message from ${data.name}`);
      const body = encodeURIComponent(`${data.message}\n\n— ${data.name} (${data.email})`);
      window.location.href = `mailto:${CONFIG.contact.email}?subject=${subject}&body=${body}`;
      note.textContent = "Opening your email app…"; note.className = "note ok"; return;
    }
    try {
      btn.disabled = true; if(lbl) lbl.textContent = "Sending…";
      const res = await fetch(endpoint, { method:"POST", headers:{ "Accept":"application/json", "Content-Type":"application/json" }, body: JSON.stringify(data) });
      if(res.ok){ form.reset(); note.textContent = "Thanks — your message is on its way!"; note.className = "note ok"; }
      else { note.textContent = "Something went wrong. Try again or email me directly."; note.className = "note err"; }
    } catch { note.textContent = "Network error. Try again or email me directly."; note.className = "note err"; }
    finally { btn.disabled = false; if(lbl) lbl.textContent = "Send"; }
  });
}


/* =====================================================================
   LIQUID SWIPE ENGINE
   ===================================================================== */
const baseLayer = document.getElementById('baseLayer');
const topLayer  = document.getElementById('topLayer');   // L: halaman berikutnya (maju)
const topLayerR = document.getElementById('topLayerR');  // R: halaman sebelumnya (mundur)
const blobPathL = document.getElementById('blobPath');
const blobPathR = document.getElementById('blobPathR');
const swipeBtn  = document.getElementById('swipeBtn');
const edgeBack  = document.getElementById('edgeBack');
let H = window.innerHeight, W = window.innerWidth;
let MOBILE = window.matchMedia('(max-width: 820px)').matches;

/* Blob KIRI / ATAS (maju) */
function getPath(y, x, w){
  const A = 200 + x * 0.5, C = A - 60;
  return `M0,${H} H0 V0 h${w} v${y - A} c0,${C},${x},${C},${x},${A} S${w},${y},${w},${y + A*2} V${H} z`;
}
function getPathV(xp, d, h){
  const A = 200 + d * 0.5, C = A - 60;
  return `M${W},0 L0,0 L0,${h} L${xp - A},${h} C${xp - A + C},${h} ${xp - A + C},${h + d} ${xp},${h + d} S${xp},${h} ${xp + A*2},${h} L${W},${h} Z`;
}
/* Blob KANAN / BAWAH (mundur) — cermin dari yang di atas */
function getPathRight(y, x, w){
  const A = 200 + x * 0.5, C = A - 60;
  return `M${W},${H} H${W} V0 h${-w} v${y - A} c0,${C},${-x},${C},${-x},${A} S${W - w},${y},${W - w},${y + A*2} V${H} z`;
}
function getPathVBottom(xp, d, h){
  const A = 200 + d * 0.5, C = A - 60;
  return `M${W},${H} L0,${H} L0,${H - h} L${xp - A},${H - h} C${xp - A + C},${H - h} ${xp - A + C},${H - h - d} ${xp},${H - h - d} S${xp},${H - h} ${xp + A*2},${H - h} L${W},${H - h} Z`;
}
function buildPathL(p, d, t){ return MOBILE ? getPathV(p, d, t) : getPath(p, d, t); }
function buildPathR(p, d, t){ return MOBILE ? getPathVBottom(p, d, t) : getPathRight(p, d, t); }
function drawLrest(){  blobPathL.setAttribute('d', buildPathL(restPos(), 48, 5)); }
function drawLgone(){  blobPathL.setAttribute('d', buildPathL(restPos(), 0, 0)); }
function drawRempty(){ blobPathR.setAttribute('d', buildPathR(restPos(), 0, 0)); }

function fullLen(){ return MOBILE ? H : W; }
function restPos(){ return MOBILE ? W * 0.5 : H * 0.72; }
function restBtn(){ return MOBILE ? { x: W * 0.5 - 23, y: 7 } : { x: 7, y: H * 0.72 - 20 }; }

function mk(v){ return { v:v, vel:0, t:v }; }
const CFG_LIQUID = { t:170, f:26, m:3 };   // saat menarik (rasa liquid)
const CFG_CLOSE  = { t:200, f:30, m:1.3 }; // saat menutup (dipercepat)
const CFG_SNAP   = { t:300, f:30, m:1 };   // saat intro/return (siap kilat)
function step(s, dt, cfg){
  const a = (-cfg.t*(s.v - s.t) - cfg.f*s.vel) / cfg.m;
  s.vel += a*dt; s.v += s.vel*dt;
}
function settled(s){ return Math.abs(s.v - s.t) < 0.5 && Math.abs(s.vel) < 0.6; }

const state = {
  base: 0,
  active: 'L', dir: 'fwd',
  phase: 'intro', committed: false,
  py: mk(restPos()), px: mk(0), pw: mk(0),
  bx: mk(-70), by: mk(0),
  dragStart: 0, curPrimary: 0, curCross: 0,
  raf: null, lastRAF: 0
};
const isClosing = () => state.phase === 'close1' || state.phase === 'close2';

function setIntroTargets(){
  const b = restBtn();
  state.py.t = restPos(); state.px.t = 48; state.pw.t = 5;
  state.bx.t = b.x; state.by.t = b.y;
}
function preIntro(){
  const b = restBtn();
  state.py.v = restPos(); state.py.vel = 0;
  state.px.v = 0; state.px.vel = 0;
  state.pw.v = 0; state.pw.vel = 0;
  state.bx.v = b.x; state.bx.vel = 0;   // tombol LANGSUNG di posisi diam -> bisa langsung ditarik
  state.by.v = b.y; state.by.vel = 0;
}
let btnEnterT = 0;   // waktu mulai animasi masuk tombol swipe
function draw(){
  const dpath = (state.active === 'L' ? buildPathL : buildPathR)(state.py.v, state.px.v, state.pw.v);
  (state.active === 'L' ? blobPathL : blobPathR).setAttribute('d', dpath);

  // animasi masuk: tombol mengecil→membesar + memudar masuk (tidak nongol mendadak)
  let k = 1;
  if(btnEnterT){
    k = Math.min(1, (performance.now() - btnEnterT) / 460);
    if(k >= 1) btnEnterT = 0;

/* ---------------------------------------------------------------
   Layer "intip" (kiri & kanan) TIDAK dibangun bersamaan dengan
   halaman aktif — itu penyebab jeda tiap ganti halaman, karena
   3 halaman + semua React-nya (Waves, kaca, masonry, Stack, Lanyard)
   dirender sekaligus. Sekarang keduanya dibangun saat browser senggang,
   dan dipaksa selesai kalau user keburu menarik pegangan.
   --------------------------------------------------------------- */
let pendingPreview = null, previewIdle = null;

function schedulePreviews(){
  return;                         // navigasi kini lewat menu, bukan swipe → tanpa layer intip sama sekali
  cancelPreviews();
  pendingPreview = { l: (state.base + 1) % N, r: (state.base - 1 + N) % N };
  // tunggu transisi selesai dulu, lalu bangun SATU per SATU (tidak sekaligus)
  const idle = (fn, t) => (typeof requestIdleCallback === 'function')
    ? requestIdleCallback(fn, { timeout: t })
    : setTimeout(fn, 60);
  previewIdle = setTimeout(() => {
    previewIdle = idle(() => {
      if(!pendingPreview) return;
      const l = pendingPreview.l;
      buildTopL(l);
      pendingPreview.l = null;
      previewIdle = idle(() => {                 // layer kedua menyusul di frame senggang berikutnya
        if(!pendingPreview) return;
        const r = pendingPreview.r;
        pendingPreview = null;
        buildTopR(r);
        previewIdle = null;
      }, 400);
    }, 300);
  }, 420);
}
function cancelPreviews(){
  if(previewIdle !== null){
    if(typeof cancelIdleCallback === 'function') cancelIdleCallback(previewIdle);
    clearTimeout(previewIdle);
    previewIdle = null;
  }
}
function flushPreviews(){
  if(!pendingPreview) return;
  const p = pendingPreview;
  pendingPreview = null;
  cancelPreviews();
  if(p.l !== null) buildTopL(p.l);
  if(p.r !== null) buildTopR(p.r);
}

/* Halaman yang tadi "diintip" LANGSUNG dipakai: node DOM-nya dipindahkan
   ke layer utama. Tidak dirender ulang, tidak di-init ulang → data tidak

function promoteInto(src, idx){
  document.body.dataset.page = PAGES[idx].key;
  document.body.dataset.lanyardUp = '0';
  baseLayer.innerHTML = '';
  while(src.firstChild) baseLayer.appendChild(src.firstChild);   // pindah, bukan render ulang
  src.innerHTML = '';
  // efek hover-tebal: hidupkan ulang untuk konten yang baru pindah
  stopProx();
  startProximity(baseLayer);
  requestAnimationFrame(() => { if(baseLayer._proxRecompute) baseLayer._proxRecompute(); });
}

function doSwap(){
  const back = (state.dir === 'back');
  const nextIdx = back ? (state.base - 1 + N) % N : (state.base + 1) % N;
  const src = back ? topLayerR : topLayer;

  state.base = nextIdx;
  if(src.firstChild) promoteInto(src, nextIdx);   // ← pakai layer intip apa adanya
  else buildBase(nextIdx);                        // cadangan: kalau belum sempat dibangun

  swipeBtn.style.borderColor = PAGES[(state.base + 1) % N].swipeBtn;
  swipeBtn.style.color = PAGES[(state.base + 1) % N].swipeBtn;
  state.active = 'L'; state.dir = 'fwd';
  drawRempty();
  preIntro(); setIntroTargets();
  state.phase = 'intro'; state.committed = false;
  btnEnterT = performance.now();            // tombol swipe masuk beranimasi
  draw();
  ensureLoop();
  schedulePreviews();                       // dua layer intip dibangun saat senggang
}
function commit(){
  if(state.committed) return;
  state.committed = true; state.phase = 'close1';
  state.py.t = state.curCross; state.px.t = -50; state.pw.t = fullLen();
  ensureLoop();
}

/* ---- mulai gerakan maju (pegangan kiri/atas) ---- */
function onDownFwd(e){
  if(state.phase === 'close1' || state.phase === 'close2' || state.phase === 'drag') return;
  flushPreviews();          // user menarik → pastikan layer intip sudah jadi
  if(state.active !== 'L'){                 // pindah dari mode mundur -> reset
    drawRempty();
    const b = restBtn();
    state.py.v = restPos(); state.px.v = 48; state.pw.v = 5;
    state.bx.v = b.x; state.by.v = b.y;
    state.py.vel = state.px.vel = state.pw.vel = state.bx.vel = state.by.vel = 0;
  } else if(state.phase === 'intro' || state.phase === 'return'){
    // ada niat menarik lagi -> selesaikan animasi masuk SEKETIKA
    setIntroTargets();
    ['py','px','pw','bx','by'].forEach(k => { state[k].v = state[k].t; state[k].vel = 0; });
  }
  state.active = 'L'; state.dir = 'fwd';
  beginDrag(e);
}
/* ---- mulai gerakan mundur (tepi kanan/bawah, tak terlihat) ---- */
function onDownBack(e){
  if(state.phase === 'close1' || state.phase === 'close2' || state.phase === 'drag') return;
  flushPreviews();          // user menarik → pastikan layer intip sudah jadi
  drawLrest();                              // bekukan pegangan kiri di posisi diam
  state.active = 'R'; state.dir = 'back';
  const cross = MOBILE ? e.clientX : e.clientY;
  state.py.v = cross; state.px.v = 0; state.pw.v = 0;
  state.py.vel = state.px.vel = state.pw.vel = 0;
  beginDrag(e);
}
function beginDrag(e){
  state.phase = 'drag'; state.committed = false;
  state.dragStart = MOBILE ? e.clientY : e.clientX;
  state.curPrimary = 0;
  state.curCross = MOBILE ? e.clientX : e.clientY;
  document.body.classList.add('dragging');
  const el = (state.active === 'L') ? swipeBtn : edgeBack;
  try { el.setPointerCapture(e.pointerId); } catch(_){}
  ensureLoop();
}
function onMove(e){
  if(state.phase !== 'drag' || state.committed) return;
  const axis = MOBILE ? e.clientY : e.clientX;
  const cross = MOBILE ? e.clientX : e.clientY;
  const primary = (state.dir === 'fwd') ? (axis - state.dragStart) : (state.dragStart - axis);
  state.curPrimary = primary; state.curCross = cross;
  state.py.t = cross; state.px.t = primary + 60; state.pw.t = 10;
  if(state.active === 'L'){
    if(MOBILE){ state.bx.t = cross - 23; state.by.t = primary + 7; }
    else      { state.bx.t = primary + 20; state.by.t = cross - 20; }
  }
  // Tarik lanyard ke atas begitu swipe meninggalkan halaman contact ≥25%
  if(document.body.dataset.page === 'contact'){
    document.body.dataset.lanyardUp = (primary / fullLen() >= 0.25) ? '1' : '0';
  }

function onUp(e){
  if(state.phase !== 'drag') return;
  document.body.classList.remove('dragging');
  const el = (state.active === 'L') ? swipeBtn : edgeBack;
  try { el.releasePointerCapture(e.pointerId); } catch(_){}
  if(state.committed) return;
  if(state.curPrimary > fullLen() * 0.5) commit();
  else {
    document.body.dataset.lanyardUp = '0';   // batal → lanyard turun lagi
    // balik ke posisi diam (maju -> sliver, mundur -> kosong)
    if(state.active === 'L'){ setIntroTargets(); }
    else { state.py.t = state.curCross; state.px.t = 0; state.pw.t = 0; state.restoreL = true; }
    state.phase = 'return'; ensureLoop();
  }
}

function initEasterEggs(){
  const AUTO_MS = 2600; // hilang otomatis ~2 detik (setelah animasi muncul)
  // dibaca ulang tiap penekanan tombol, supaya data dari admin (Supabase) ikut terpakai
  function buildEggs(){

  Object.keys(raw).forEach(k => {
    const v = raw[k];
    let imgs = [], style = 'confetti', cap = '';
    if(typeof v === 'string'){ imgs = [v]; }
    else if(v){
      imgs  = (v.images && v.images.length) ? v.images.slice() : (v.img ? [v.img] : []);
      style = v.style || 'confetti';
      cap   = v.caption || '';
    }
    eggs[k.toLowerCase()] = { images: imgs.filter(Boolean), style, caption: cap };
  });
  return eggs;
  }

  let buf = "", overlay = null, stage = null, confettiLayer = null, flash = null, hideTimer = null;

  function ensureOverlay(){
    if(overlay) return;
    overlay = document.createElement('div');
    overlay.className = 'egg-overlay';
    overlay.innerHTML = '<div class="egg-flash"></div><div class="egg-confetti"></div><div class="egg-stage"></div><div class="egg-hint">klik / tekan tombol untuk menutup</div>';
    document.body.appendChild(overlay);
    flash = overlay.querySelector('.egg-flash');
    confettiLayer = overlay.querySelector('.egg-confetti');
    stage = overlay.querySelector('.egg-stage');
    overlay.addEventListener('click', hide);
  }
  function burstConfetti(){
    const colors = ['#E7B996','#C9A24A','#ff5d73','#4ea8ff','#6ee7a8','#ffd93d','#c77dff','#ffffff','#ff9f45'];
    const N = 140;
    for(let k=0;k<N;k++){
      const p = document.createElement('i');
      const size = 6 + Math.random()*9;
      p.style.left = (Math.random()*100) + 'vw';
      p.style.width = size + 'px';
      p.style.height = (size*1.4) + 'px';
      p.style.background = colors[k % colors.length];
      p.style.setProperty('--dx', ((-24 + Math.random()*48)) + 'vw');
      p.style.setProperty('--rot', (360 + Math.random()*1000) + 'deg');
      p.style.animationDuration = (1.6 + Math.random()*1.6) + 's';
      p.style.animationDelay = (Math.random()*0.25) + 's';
      confettiLayer.appendChild(p);
    }
  }
  function show(word, egg){
    ensureOverlay();
    clearTimeout(hideTimer);
    const list = (egg.images && egg.images.length)
      ? egg.images.slice(0, 10)                 // maksimal 10 foto
      : [placeholder(word + "  \u2726", "#141316", "#E7B996", 700, 500)];

    confettiLayer.innerHTML = '';
    stage.className = 'egg-stage ' + egg.style + (list.length > 1 ? ' many' : '');

    // Banyak foto → disebar melingkar mengelilingi tengah layar (bukan menumpuk)
    const N = list.length;
    const mob = window.matchMedia('(max-width:820px)').matches;
    stage.innerHTML = list.map((src, i) => {
      let dx = 0, dy = 0, rot, sc;
      if(N === 1){
        rot = (-3 + Math.random() * 6).toFixed(1);
        sc  = 1;
      } else {
        // dua lingkaran kalau fotonya banyak → tidak sesak
        const twoRings = N > 6;
        const ring  = (twoRings && i % 2 === 1) ? 0.58 : 1;
        const ang   = (i / N) * Math.PI * 2 - Math.PI / 2 + (Math.random() * 0.22 - 0.11);
        const rx    = (mob ? 30 : 28) * ring;      // vw
        const ry    = (mob ? 22 : 27) * ring;      // vh
        dx  = (Math.cos(ang) * rx).toFixed(1);
        dy  = (Math.sin(ang) * ry).toFixed(1);
        rot = (-14 + Math.random() * 28).toFixed(1);
        sc  = (0.72 + Math.random() * 0.2).toFixed(2);
      }
      const st = `--rot:${rot}deg; --dx:${dx}vw; --dy:${dy}vh; --sc:${sc}; animation-delay:${(i * 0.07).toFixed(2)}s; z-index:${10 + i};`;
      return (egg.style === 'polaroid')
        ? `<div class="egg-polaroid" style="${st}"><img src="${esc(src)}" alt=""><div class="egg-cap">${esc(egg.caption || word)}</div></div>`
        : `<img class="egg-pop-img" style="${st}" src="${esc(src)}" alt="">`;
    }).join('');
    // retrigger kilatan cahaya + reflow agar animasi selalu terputar ulang
    flash.classList.remove('go'); void flash.offsetWidth; flash.classList.add('go');
    void stage.offsetWidth;
    overlay.classList.add('show');
    burstConfetti();
    hideTimer = setTimeout(hide, AUTO_MS);
  }
  function hide(){
    clearTimeout(hideTimer);
    if(overlay){ overlay.classList.remove('show'); if(confettiLayer) confettiLayer.innerHTML = ''; }
  }

  window.addEventListener('keydown', (e) => {
    if(e.repeat) return; // abaikan auto-repeat (tahan tombol) → tak menutup tak sengaja
    if(overlay && overlay.classList.contains('show')){ hide(); return; }
    const t = e.target;
    if(t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
    if(e.key && e.key.length === 1 && /[a-z0-9]/i.test(e.key)){
      const eggs = buildEggs();
      const words = Object.keys(eggs);
      if(!words.length) return;
      const maxLen = Math.max(...words.map(w => w.length));
      buf = (buf + e.key.toLowerCase()).slice(-(maxLen + 2));
      for(const w of words){ if(buf.endsWith(w)){ buf = ""; show(w, eggs[w]); break; } }
    }
  });
}

      const g = socialsToArr(P.socials.general,'general'), t = socialsToArr(P.socials.tech,'tech'), a = socialsToArr(P.socials.art,'art');
      if(g.length) c.general = g;
      if(t.length) c.tech = t;
      if(a.length) c.art = a;
    }
    if(P.lanyard_name) L.card.name = P.lanyard_name;
    if(P.lanyard_role) L.card.role = P.lanyard_role;
    if(P.lanyard_photo_url) L.card.photo = P.lanyard_photo_url;
    if(P.lanyard_band_url) L.bandImage = P.lanyard_band_url;
    if(P.lanyard_front_url) L.frontImage = P.lanyard_front_url;
    if(P.lanyard_back_url) L.backImage = P.lanyard_back_url;
  }
  if(projects && projects.length){
    CONFIG.projects.items = projects.map(r => ({
      title:r.title||'', cat:r.cat||'web', org:r.org||'', feature:!!r.feature, ar:Number(r.ar)||1,
      cover:r.cover_url||'', tags:r.tags||[], description:r.description||'', images:r.images||[], link:r.url||''
    }));
  }
  if(certs && certs.length){
    CONFIG.projects.certificates = certs.map(r => ({
      title:r.title||'', issuer:r.issuer||'', image:r.image_url||'', url:r.url||''
    }));
  }
  if(services && services.length){
    CONFIG.projects.services = services.map(r => ({
      name:r.name||'', desc:r.description||'', deliverables:r.deliverables||[]
    }));
  }
  if(acts && acts.length){
    CONFIG.activity.items = acts.map(r => ({
      title:r.title||'', text:r.text||'', meta:parseMeta(r.meta), photo:r.photo_url||'',
      modalTitle:r.modal_title||r.title||'', modalDesc:r.modal_desc||'', gallery:r.gallery||[],
      cat:r.cat||'', year:r.year_label||''
    }));
  }
  if(skills && skills.length){
    CONFIG.activity.skills = skills.map(r => ({
      title:r.title||'', tags:r.tags||[], photo:r.photo_url||''
    }));
  }
}

/* ---- Header kaca saat scroll: aktif di halaman manapun, begitu halaman digulir ----
   Yang digulir adalah elemen .page atau .proj-scroll (bukan window), dan elemennya
   berganti tiap pindah halaman → pakai fase capture di document supaya menangkap
   semuanya tanpa perlu pasang-lepas listener setiap ganti halaman. */
(function initScrollHeader(){
  let ticking = false;
  const apply = (top) => document.body.classList.toggle('scroll-veil', top > 8);
  document.addEventListener('scroll', (e) => {
    const el = e.target;
    if(!el || el === document || !el.classList) return;
    if(!el.classList.contains('page') && !el.classList.contains('proj-scroll')) return;
    if(ticking) return;
    ticking = true;
    requestAnimationFrame(() => { apply(el.scrollTop); ticking = false; });
  }, true);
  // pindah halaman → posisi scroll kembali ke atas, veil ikut direset
  window.addEventListener('page-changed', () => document.body.classList.remove('scroll-veil'));
})();

window.LANYARD_CONFIG = CONFIG.contact.lanyard; // default sinkron untuk React (di-update setelah fetch)

(async function boot(){
  try { await loadFromSupabase(); }
  catch(e){ console.warn('Supabase gagal dimuat, pakai konten default:', e); }

  // segarkan data turunan setelah konten final
  window.LANYARD_CONFIG = CONFIG.contact.lanyard;
  window.__activityImages = activityImagesPerItem();
  window.dispatchEvent(new Event('app-data-ready'));
  window.dispatchEvent(new Event('lanyard-config-updated'));

  applyMode();
  // Halaman awal mengikuti file yang dibuka (index.html=home, about-me.html=activity, dst),
  // bukan selalu Home — supaya tiap file punya "pintu masuk" sendiri.
  const openedFile = location.pathname.split('/').pop();
  const startKey = FILE_PAGE[openedFile] || 'home';
  const startIdx = Math.max(0, PAGES.findIndex(p => p.key === startKey));
  state.base = startIdx;
  history.replaceState({ page: PAGES[startIdx].key }, '', location.pathname + location.search);
  buildBase(startIdx);                       // halaman pertama tampil secepatnya
  drawRempty();
  preIntro(); setIntroTargets(); draw(); ensureLoop();
  schedulePreviews();                        // layer intip menyusul saat senggang

  // Tombol back/forward browser
  window.addEventListener('popstate', (e) => {
    const key = (e.state && e.state.page) || FILE_PAGE[location.pathname.split('/').pop()] || 'home';
    window.__goPage(key, { skipHistory: true });
  });

  // Judul tab mengikuti halaman aktif
  const PAGE_TITLE = {
    home: 'Muhammad Ilham | Aren — Portfolio',
    projects: 'Project | Aren — Portfolio',
    activity: 'About Me | Aren — Portfolio',
    contact: 'Contact | Aren — Portfolio',
  };
  const syncTitle = (key) => { document.title = PAGE_TITLE[key] || PAGE_TITLE.home; };
  syncTitle(startKey);
  window.addEventListener('page-changed', (e) => syncTitle(e.detail));
})();
</script>
