<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Muhammad Ilham | Aren — Portfolio</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@100..900&family=Anton&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: "Inter", system-ui, -apple-system, sans-serif;
  overflow: hidden;
  background: #ffffff;
  -webkit-font-smoothing: antialiased;
}
img { display: block; max-width: 100%; }
a { text-decoration: none; color: inherit; }

/* ============ STAGE + LAYERS ============ */
#stage { position: fixed; inset: 0; width: 100vw; height: 100vh; overflow: hidden; }
.layer { position: absolute; inset: 0; width: 100%; height: 100%; }
#baseLayer { z-index: 1; }
#topLayer  { z-index: 2; pointer-events: none; clip-path: url(#blobClip); -webkit-clip-path: url(#blobClip); }
#topLayerR { z-index: 3; pointer-events: none; clip-path: url(#blobClipR); -webkit-clip-path: url(#blobClipR); }
#edgeBack  { position: fixed; z-index: 4; top: 0; right: 0; width: 30px; height: 100%; background: transparent; cursor: grab; touch-action: none; }
#edgeBack:active { cursor: grabbing; }
.svgdefs { position: absolute; width: 0; height: 0; }

#swipeBtn {
  position: absolute; z-index: 5; top: 0; left: 0;
  width: 46px; height: 46px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: transparent; border: 1.5px solid #E7B996; color: #E7B996;
  cursor: grab; touch-action: none; will-change: transform, opacity;
  transition: border-color .4s ease, color .4s ease;
}
#swipeBtn:active { cursor: grabbing; }
#swipeBtn svg { width: 16px; height: 16px; }
#swipeBtn.vert svg { transform: rotate(90deg); }   /* di HP: panah menunjuk ke bawah */
#swipeBtn .pulse {
  position: absolute; inset: -1.5px; border-radius: 50%;
  border: 1.5px solid currentColor; opacity: 0;
  animation: btnPulse 2.4s ease-out infinite;
}
@keyframes btnPulse { 0%{transform:scale(1);opacity:.5} 70%{transform:scale(1.9);opacity:0} 100%{opacity:0} }
body.dragging { user-select: none; }
body.dragging #swipeBtn .pulse { display: none; }

/* ============ PAGE SHARED ============ */
.page { width: 100%; height: 100%; position: relative; overflow: hidden; }
.page-inner {
  width: 100%; height: 100%; max-width: 1400px; margin: 0 auto;
  padding: clamp(28px,5vw,80px) clamp(28px,6vw,110px);
  display: flex; align-items: center;
}

/* ============ PAGE 1 — HOME ============ */
.page.home { background: #ffffff; }
.home-bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.home .page-inner { gap: clamp(30px,5vw,80px); position: relative; z-index: 1; }
.home-left { flex: 1 1 55%; min-width: 0; }
.home-right { flex: 1 1 45%; display: flex; justify-content: flex-end; perspective: 900px; }
.photo-wrap { position: relative; }
.photo-cap {
  position: absolute; left: 0; top: 0; pointer-events: none; z-index: 3;
  background: #ffffff; color: #2d2d2d; font-family: "Inter", sans-serif;
  font-size: 12px; padding: 4px 10px; border-radius: 4px; white-space: nowrap;
  opacity: 0; transform: translate(-50%, -160%); transition: opacity .18s ease;
}

.name {
  font-family: "Playfair Display", serif; font-weight: 900;
  color: #121316; line-height: 1.0; letter-spacing: -0.4px;
  font-size: clamp(2.1rem, 5vw, 3.6rem); text-transform: uppercase;
}
.name .bar { font-weight: 300; color: #cfcfcf; padding: 0 .12em; }
.role {
  margin-top: clamp(12px,1.8vw,20px);
  font-family: "JetBrains Mono", monospace; font-weight: 700;
  color: #17181b; font-size: clamp(.98rem, 1.7vw, 1.3rem);
  letter-spacing: .8px; min-height: 1.3em;
}
.role .caret { display:inline-block; color:#17181b; font-weight:400; animation: blink 1s steps(1) infinite; transform: translateY(-1px); }
@keyframes blink { 50%{opacity:0} }
.cv-btn {
  display: inline-flex; align-items: center; margin-top: clamp(18px,2.4vw,24px);
  background: #141316; color: #ffffff;
  font-family: "Inter", sans-serif; font-weight: 600;
  font-size: 1rem; padding: 12px 26px; border-radius: 0; transition: transform .25s, background .25s;
}
.cv-btn:hover { transform: translateY(-3px); background: #000; }
.home-desc {
  margin-top: clamp(16px,2.4vw,26px); max-width: 42ch; color: #5b6472;
  font-size: clamp(.92rem, 1.15vw, 1.05rem); line-height: 1.7; font-weight: 400;
}

/* meta: lokasi + status available */
.home-meta { display: flex; flex-wrap: wrap; gap: 22px; margin-top: clamp(18px,2.4vw,26px); }
.home-meta .hm-item { display: inline-flex; align-items: center; gap: 7px; color: #8a909a; font-family: "Inter", sans-serif; font-size: .86rem; }
.home-meta .hm-item svg { width: 15px; height: 15px; }
.home-meta .hm-spark { width: 12px; height: 12px; color: #9aa0a8; }

/* pemisah + baris bawah (sosial + copyright) */
.home-divider { height: 1px; background: #ececec; width: 100%; max-width: 480px; margin: clamp(24px,3.2vw,34px) 0 clamp(16px,2vw,20px); }
.home-foot { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.home-socials { display: flex; gap: 10px; }
.hsoc {
  width: 42px; height: 42px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center;
  background: #f4f1ec; color: #2a2a2a; border: 1px solid #e7e2d9;
  transition: background .2s, color .2s, transform .2s;
}
.hsoc svg { width: 18px; height: 18px; }
.hsoc:hover, .hsoc:active { background: #000; color: #fff; border-color: #000; transform: translateY(-2px); }
.copyright { color: #b3b8bf; font-size: .85rem; letter-spacing: .4px; }
.home-foot .copyright { margin-top: 0; }

.photo {
  width: min(34vw, 380px); aspect-ratio: 4 / 4.4; border-radius: 24px;
  overflow: hidden; background: #e7e0d7;
  display: flex; align-items: center; justify-content: center;
  transform-style: preserve-3d; transition: transform .18s ease-out; will-change: transform;
}
.photo img { width:100%; height:100%; object-fit: cover; }
.photo .ph-label { font-family:"JetBrains Mono",monospace; font-size:.78rem; color:#8a8177; text-align:center; padding:20px; line-height:1.6; }

/* ============ PAGE 2 — PROJECTS ============ */
.page.projects { background: #0d0d0d; }
.proj-bg { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
.proj-scroll {
  position: absolute; inset: 0; z-index: 1; overflow-y: auto;
  padding: clamp(52px,8vh,88px) clamp(24px,5vw,72px) 64px;
  scrollbar-width: none; -ms-overflow-style: none;
}
.proj-scroll::-webkit-scrollbar { width: 0; height: 0; display: none; }
.proj-wrap { max-width: 1180px; margin: 0 auto; position: relative; z-index: 1; }
.proj-title-spacer { height: clamp(64px,9vh,96px); }

/* Judul "Projects" — layer terpisah di atas GlassSurface (tak ikut scroll) */
.proj-titlebar {
  position: absolute; z-index: 40;
  top: clamp(22px,5vh,48px); left: clamp(24px,5vw,72px);
  width: clamp(170px,20vw,230px); height: clamp(58px,8vh,74px);
}
.proj-title-glass .glass-surface__content { justify-content: flex-start; padding-left: 18px; }
.proj-title-text {
  font-family: "Playfair Display", serif; font-weight: 800; color: #E7B996;
  font-size: clamp(1.1rem,1.9vw,1.55rem); letter-spacing: .4px;
}

/* ---- Sertifikat: melayang (tanpa card), ujung memudar (opacity turun) ---- */
.cert-strip { margin-bottom: clamp(22px,3vw,32px); }
.cert-eyebrow {
  font-family: "JetBrains Mono", monospace; font-size: .7rem; letter-spacing: 3px;
  text-transform: uppercase; color: rgba(231,185,150,.62); margin-bottom: 16px;
}
.cert-track {
  display: flex; gap: clamp(20px,2.6vw,38px); overflow-x: auto; padding: 4px 2px 8px; cursor: grab;
  scrollbar-width: none; -ms-overflow-style: none;
  -webkit-mask-image: linear-gradient(to right, transparent 0, rgba(0,0,0,.35) 7%, #000 26%, #000 74%, rgba(0,0,0,.35) 93%, transparent 100%);
  mask-image: linear-gradient(to right, transparent 0, rgba(0,0,0,.35) 7%, #000 26%, #000 74%, rgba(0,0,0,.35) 93%, transparent 100%);
}
.cert-track.dragging { cursor: grabbing; }
.cert-track::-webkit-scrollbar { height: 0; display: none; }
.cert-item {
  flex: 0 0 auto; width: clamp(150px,16vw,188px); cursor: pointer; text-align: left;
  transition: transform .3s cubic-bezier(.2,.8,.2,1);
}
.cert-item:hover { transform: translateY(-3px); }
.cert-item img { -webkit-user-drag: none; user-select: none; }
.cert-thumb { width: 100%; aspect-ratio: 4/3; border-radius: 12px; overflow: hidden; border: 1px solid rgba(231,185,150,.14); }
.cert-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cert-title  { margin-top: 11px; font-family: "Inter", sans-serif; font-weight: 400; font-size: .82rem; color: rgba(231,185,150,.92); line-height: 1.3; }
.cert-issuer { margin-top: 3px;  font-family: "Inter", sans-serif; font-weight: 300; font-size: .72rem; color: rgba(231,185,150,.5); letter-spacing: .2px; }

.proj-divider { height: 1px; background: rgba(231,185,150,.14); margin: 0 0 clamp(22px,3vw,30px); }

/* ---- Body head: label kiri + segmented control tech/art kanan ---- */
.body-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: clamp(16px,2.4vw,24px); }
.body-eyebrow {
  font-family: "JetBrains Mono", monospace; font-size: .7rem; letter-spacing: 3px;
  text-transform: uppercase; color: rgba(231,185,150,.62);
}
.seg {
  display: inline-flex; padding: 4px; gap: 4px; border-radius: 13px;
  background: rgba(255,255,255,.045); border: 1px solid rgba(231,185,150,.16);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.ptab {
  font-family: "JetBrains Mono", monospace; font-size: .73rem; letter-spacing: 2px; text-transform: uppercase;
  color: #E7B996; cursor: pointer; padding: 8px 20px; border-radius: 9px;
  background: transparent; border: none; transition: background .2s, color .2s;
}
.ptab:hover { background: rgba(231,185,150,.1); }
.ptab.active { background: #E7B996; color: #0d0d0d; }

/* ---- Feature project (lebih kecil): foto kiri, teks kanan RATA ATAS-KIRI ---- */
.feature {
  display: flex; gap: clamp(14px,2vw,22px); align-items: flex-start;
  border-radius: 16px; overflow: hidden; cursor: pointer;
  margin: 0 0 18px; padding: 12px; border: 1px solid rgba(231,185,150,.18);
  background: rgba(255,255,255,.045);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  transition: border-color .3s, transform .35s cubic-bezier(.2,.8,.2,1);
}
.feature:hover { border-color: #E7B996; transform: translateY(-3px); }
.feat-media { flex: 0 0 30%; max-width: 30%; border-radius: 11px; overflow: hidden; align-self: stretch; }
.feat-media img { width: 100%; height: 100%; min-height: clamp(150px,20vh,208px); object-fit: cover; display: block; }
.feat-body { flex: 1 1 auto; display: flex; flex-direction: column; align-items: flex-start; justify-content: flex-start; padding: 2px 8px 2px 0; }
.feat-badge {
  align-self: flex-start;
  font-family: "JetBrains Mono", monospace; font-size: .6rem; letter-spacing: 1.5px; text-transform: uppercase;
  color: #0d0d0d; background: #E7B996; padding: 4px 9px; border-radius: 6px; margin-bottom: 10px;
}
.feat-title { font-family: "Playfair Display", serif; font-weight: 800; color: #E7B996; font-size: clamp(1.2rem, 1.9vw, 1.55rem); line-height: 1.12; text-align: left; }
.feat-desc { color: rgba(231,185,150,.7); font-family: "Inter", sans-serif; font-size: .87rem; line-height: 1.5; margin-top: 8px; max-width: 54ch; text-align: left; }
.feat-tags { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; }
.feat-tags span {
  font-family: "JetBrains Mono", monospace; font-size: .64rem; letter-spacing: 1px; text-transform: uppercase;
  color: #E7B996; border: 1px solid rgba(231,185,150,.35); border-radius: 7px; padding: 3px 9px;
  background: rgba(0,0,0,.18);
}

/* ---- Grid Projects (Masonry React di-mount ke sini) ---- */
.pgrid { position: relative; width: 100%; }

/* Efek Chroma: monokrom seluruh halaman Projects, warna asli muncul di sekitar kursor.
   Overlay ADA DI DALAM halaman → ikut terpotong saat swipe (halaman sebelah tidak jadi abu). */
.proj-gray { position: absolute; inset: 0; pointer-events: none; z-index: 30; --x: 50%; --y: 50%; --r: 480px; }
.proj-gray .chroma-overlay, .proj-gray .chroma-fade {
  position: absolute; inset: 0; pointer-events: none;
  backdrop-filter: grayscale(1) brightness(.82); -webkit-backdrop-filter: grayscale(1) brightness(.82);
  background: rgba(0,0,0,.001);
}
.proj-gray .chroma-overlay {
  -webkit-mask-image: radial-gradient(circle var(--r) at var(--x) var(--y), transparent 0%, transparent 34%, rgba(0,0,0,.22) 55%, rgba(0,0,0,.5) 76%, rgba(0,0,0,.7) 90%, #000 100%);
  mask-image: radial-gradient(circle var(--r) at var(--x) var(--y), transparent 0%, transparent 34%, rgba(0,0,0,.22) 55%, rgba(0,0,0,.5) 76%, rgba(0,0,0,.7) 90%, #000 100%);
}
.proj-gray .chroma-fade {
  opacity: 1; transition: opacity .25s ease;
  -webkit-mask-image: radial-gradient(circle var(--r) at var(--x) var(--y), #fff 0%, #fff 34%, rgba(255,255,255,.6) 65%, rgba(255,255,255,.3) 90%, transparent 100%);
  mask-image: radial-gradient(circle var(--r) at var(--x) var(--y), #fff 0%, #fff 34%, rgba(255,255,255,.6) 65%, rgba(255,255,255,.3) 90%, transparent 100%);
}

/* ============ PAGE 3 — ACTIVITY ============ */
.page.activity { background: #871003; }
.activity .page-inner { gap: clamp(30px,5vw,80px); }
.act-left { flex: 1 1 52%; min-width: 0; }
.act-right { flex: 1 1 48%; display: flex; align-items: center; justify-content: flex-end; gap: clamp(14px,2vw,26px); }

.activity .eyebrow { font-family:"JetBrains Mono",monospace; font-size:.8rem; letter-spacing:3px; text-transform:uppercase; color:#62A461; opacity:.8; margin-bottom:16px; }
.activity h2 { font-family:"Playfair Display",serif; font-weight:800; color:#62A461; font-size:clamp(2.6rem,6vw,4.6rem); line-height:1; }
.activity .act-text { margin-top: clamp(18px,3vw,30px); color:#7ab878; max-width:42ch; font-size:clamp(1rem,1.4vw,1.2rem); line-height:1.8; }
.activity .act-meta { margin-top:26px; display:flex; flex-wrap:wrap; gap:22px; }
.activity .act-meta .item .k { font-family:"JetBrains Mono",monospace; font-size:.72rem; letter-spacing:1px; color:#4f8a4e; text-transform:uppercase; }
.activity .act-meta .item .v { color:#62A461; font-weight:600; font-size:1.05rem; margin-top:4px; }
.act-stack {
  width: min(38vw, 440px); aspect-ratio: 5/4.2; position: relative;
}
.act-stack-static { width:100%; height:100%; object-fit:cover; border-radius:22px; }

/* ============ PAGE 4 — CONTACT ============ */
.page.contact { background: #57A45B; }
.contact .page-inner { gap: clamp(24px,3vw,50px); align-items: center; justify-content: space-between; position: relative; }
.c-left { flex: 0 1 40%; min-width: 0; }
.c-right { flex: 0 1 38%; display: flex; justify-content: flex-end; }

/* Lanyard 3D (React overlay) — full-screen agar tidak terpotong; pointer diteruskan ke bawah */
#lanyard-root {
  position: fixed; inset: 0; width: 100%; height: 100%; z-index: 6;
  opacity: 0; pointer-events: none;
  transition: opacity .45s ease, transform .5s cubic-bezier(.4,0,.2,1);
}
body[data-page="contact"] #lanyard-root { opacity: 1; }
/* Saat mulai swipe meninggalkan contact (≥25%), lanyard ditarik ke atas */
body[data-lanyard-up="1"] #lanyard-root { transform: translateY(-118%); opacity: 0; }

.connect { font-family:"Anton",sans-serif; color:#300584; font-size:clamp(3rem,7.5vw,6rem); line-height:.88; letter-spacing:1px; text-transform:uppercase; }
.c-left .sub { margin-top: clamp(18px,2.6vw,28px); color:#2a1668; max-width:27ch; font-size:clamp(1.02rem,1.4vw,1.28rem); line-height:1.5; font-weight:500; }
.socials { display:flex; gap:16px; flex-wrap:wrap; align-items:center; }
.socials.main { margin-top: clamp(24px,4vw,40px); }
.socials a { color:#300584; opacity:.85; transition: transform .25s, opacity .25s; }
.socials a:hover { opacity:1; transform: translateY(-3px); }
.socials svg { width:26px; height:26px; }
.soc-groups { margin-top: clamp(20px,3vw,30px); display:flex; gap:16px; flex-wrap:wrap; }

/* Kartu sosmed beranimasi (tertutup label, terbuka saat hover) */
.soc-card {
  position:relative; display:flex; align-items:center; justify-content:center;
  background:#57A45B; overflow:hidden; height:40px; min-width:104px; border-radius:9px;
  transition: all .3s cubic-bezier(.25,.8,.25,1);
}
.soc-card::before, .soc-card::after {
  content:""; position:absolute; display:flex; align-items:center;
  width:50%; height:100%; transition:.25s linear; z-index:1; background:#3a4fb8;
}
.soc-card::before { left:0;  justify-content:flex-end; }
.soc-card::after  { right:0; justify-content:flex-start; }
.soc-card:hover span { opacity:0; z-index:-3; }
.soc-card:hover::before { opacity:.5; transform:translateY(-100%); }
.soc-card:hover::after  { opacity:.5; transform:translateY(100%); }
.soc-card span {
  position:absolute; display:flex; align-items:center; justify-content:center;
  width:100%; height:100%; color:whitesmoke; font-family:"JetBrains Mono",monospace;
  font-size:13px; font-weight:700; letter-spacing:2px; text-transform:uppercase;
  opacity:1; transition:opacity .25s; z-index:2;
}
.soc-card .social-link {
  position:relative; display:flex; align-items:center; justify-content:center;
  flex:1 1 auto; min-width:34px; height:100%; text-decoration:none;
  color:#3a4fb8; transition: transform .2s ease;
}
.soc-card .social-link svg { height:18px; width:auto; }
.soc-card .social-link:hover { transform: scale(1.12); }

.contact-form { width: min(460px, 100%); background:#300584; border-radius:0; padding: clamp(24px,2.6vw,36px); }
.contact-form .fld { margin-bottom: 18px; }
.contact-form label { display:block; color:#7ec97e; font-weight:700; font-size:1.02rem; margin-bottom:10px; letter-spacing:.3px; }
.contact-form input, .contact-form textarea {
  width:100%; background:#2a0473; border:1.5px solid #4a1fa0; border-radius:16px;
  color:#e9e2ff; font-family:"Inter",sans-serif; font-size:1rem; padding:15px 18px;
  outline:none; transition: border-color .25s, background .25s;
}
.contact-form input:focus, .contact-form textarea:focus { border-color:#7ec97e; background:#310c82; }
.contact-form textarea { resize:none; min-height:116px; }
.contact-form .send {
  width:100%; margin-top:6px; background:#57A45B; color:#08260a; border:none; border-radius:18px;
  font-family:"Inter",sans-serif; font-weight:700; font-size:1.08rem; padding:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; overflow:hidden; transition: all .2s;
}
.contact-form .send span { display:block; margin-left:.3em; transition: all .3s ease-in-out; }
.contact-form .send svg { display:block; transform-origin:center center; transition: transform .3s ease-in-out; }
.contact-form .send:hover .svg-wrapper { animation: fly-1 .6s ease-in-out infinite alternate; }
.contact-form .send:hover svg { transform: translateX(1.2em) rotate(45deg) scale(1.1); }
.contact-form .send:hover span { transform: translateX(5em); opacity: 0; }
.contact-form .send:active { transform: scale(.95); }
@keyframes fly-1 { from { transform: translateY(.1em); } to { transform: translateY(-.1em); } }
.contact-form .send:disabled { opacity:.6; cursor:default; }
.contact-form .note { margin-top:14px; text-align:center; color:#a9c9a9; font-size:.78rem; letter-spacing:.3px; }
.contact-form .note.ok { color:#dfffdf; }
.contact-form .note.err { color:#ffdcdc; }

/* ============ MODAL ============ */
#modalRoot {
  position: fixed; inset: 0; z-index: 50; display: none;
  align-items: center; justify-content: center; padding: 24px;
  background: rgba(6,6,8,.62); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
}
#modalRoot.open { display: flex; }
.modal-card { width: min(920px,96vw); max-height: 88vh; border-radius: 22px; overflow: hidden; display: flex; flex-direction: column; animation: modalIn .32s cubic-bezier(.2,.8,.2,1); }
@keyframes modalIn { from{opacity:0; transform: translateY(18px) scale(.98);} }
.modal-card .m-head { display:flex; align-items:flex-start; justify-content:space-between; padding:28px 30px 14px; gap:20px; }
.modal-card h3 { font-family:"Playfair Display",serif; font-weight:800; font-size:clamp(1.6rem,3vw,2.4rem); line-height:1.1; }
.modal-card .m-close { flex:none; width:42px; height:42px; border-radius:50%; border:1.5px solid currentColor; background:transparent; color:inherit; cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center; transition: background .2s; }
.modal-card .m-close:hover { background: rgba(255,255,255,.1); }
.modal-card .m-body { padding: 0 30px 20px; overflow-y:auto; }
.modal-card .m-desc { line-height:1.75; font-size:1.03rem; opacity:.92; }
.modal-card .m-meta { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px; }

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function placeholder(label, bg, fg, w, h){
  w=w||800; h=h||600;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='${w}' height='${h}'>`
    + `<rect width='${w}' height='${h}' fill='${bg}'/>`
    + `<text x='50%' y='50%' fill='${fg}' font-family='monospace' font-size='26' text-anchor='middle' dominant-baseline='middle' opacity='0.7'>${label}</text></svg>`;
  return "data:image/svg+xml;utf8," + encodeURIComponent(svg);
}
function img(src, label, bg, fg, w, h){
  return (src && src.trim()) ? esc(src) : placeholder(label||"image", bg||"#d8d2ca", fg||"#6b6459", w, h);
}

  const featureHtml = (p,i) => {
    const w = 800, h = Math.round(w * (p.ar || 1));
    return `<div class="feature" data-i="${i}">
      <div class="feat-media"><img src="${img(p.cover, p.title, '#1c1c1c', '#5a5148', w, h)}" alt="" loading="lazy"></div>

  const pane = (cat) => {

  return `

function initHome(root){
  const c = CONFIG.home;
  const isBase = root.id === 'baseLayer';
  const [n2a, n2b] = c.nameLine2.split("|");
  const nl1 = root.querySelector('#nl1'), nl2a = root.querySelector('#nl2a'), nl2b = root.querySelector('#nl2b');
  const descEl = root.querySelector('#homeDesc');
  if(nl1)  proxWrap(nl1, c.nameLine1, 600);
  if(nl2a) proxWrap(nl2a, n2a || '', 600);
  if(nl2b) proxWrap(nl2b, n2b || '', 600);
  if(descEl) proxWrap(descEl, c.description, 350);

  const el = root.querySelector('#roleText');
  const roles = CONFIG.home.roles;
  const myToken = ++typingToken;
  let ri = 0, ci = 0, deleting = false;
  (function tick(){
    if(myToken !== typingToken) return;
    const word = roles[ri];
    if(!deleting){ ci++; if(ci === word.length){ deleting=true; el.textContent=word; return setTimeout(tick,1500); } }
    else { ci--; if(ci === 0){ deleting=false; ri=(ri+1)%roles.length; el.textContent=""; return setTimeout(tick,350); } }
    el.textContent = word.slice(0, ci);
    setTimeout(tick, deleting ? 55 : 95);
  })();

  if(isBase) startProximity(root);

  // Background LiquidEther (persisten) dipindah ke slot home
  if(isBase && window.__mountHomeLiquid){
    const bg = root.querySelector('#homeBg');
    if(bg) window.__mountHomeLiquid(bg);
  }

  // Efek tilt 3D + tooltip "this is me" (gaya TiltedCard React Bits)
  const wrap = root.querySelector('.photo-wrap');
  const ph = root.querySelector('.photo');
  const cap = root.querySelector('.photo-cap');
  if(wrap && ph){
    const AMP = 14, SCALE = 1.06;
    wrap.addEventListener('mousemove', e => {
      const r = ph.getBoundingClientRect();
      const ox = e.clientX - r.left - r.width/2;
      const oy = e.clientY - r.top - r.height/2;
      const rx = (oy / (r.height/2)) * -AMP;
      const ry = (ox / (r.width/2)) * AMP;
      ph.style.transform = `rotateX(${rx}deg) rotateY(${ry}deg) scale(${SCALE})`;
      if(cap){
        const wr = wrap.getBoundingClientRect();
        cap.style.left = (e.clientX - wr.left) + 'px';
        cap.style.top  = (e.clientY - wr.top) + 'px';
        cap.style.opacity = '1';
      }
    });
    wrap.addEventListener('mouseleave', () => {
      ph.style.transform = 'rotateX(0deg) rotateY(0deg) scale(1)';
      if(cap) cap.style.opacity = '0';
    });
  }
}

function initProjects(root){
  const c = CONFIG.projects;
  const items = c.items;

  // Klik feature → modal
  const openItem = (i) => {
    const p = items[i];
    openModal({ title:p.title, desc:p.description, images:p.images, tags:p.tags, palette:{ bg:'#141414', fg:'#E7B996' } });
  };
  root.querySelectorAll('.feature').forEach(elm => {
    elm.addEventListener('click', () => openItem(+elm.dataset.i));
  });

  // Background LiquidEther (emas) + judul "Projects" di atas GlassSurface (layer terpisah)
  const projBg = root.querySelector('#projBg');
  if(projBg && window.__mountProjLiquid) window.__mountProjLiquid(projBg);

  if(titlebar && window.__mountProjTitle) window.__mountProjTitle(titlebar, c.title);

  // Grid Masonry per kategori (5 kolom + animasi masuk)
  root.querySelectorAll('.pgrid').forEach(gridEl => {
    const cat = gridEl.dataset.grid;
    const catItems = items.map((p,i)=>({p,i})).filter(o => (o.p.cat||'')===cat);
    const feat = catItems.find(o=>o.p.feature) || catItems[0];
    const rest = catItems.filter(o => o !== feat);
    const mItems = rest.map(o => ({
      id: 'p'+o.i,
      img: img(o.p.cover, o.p.title, '#1c1c1c', '#5a5148', 600, Math.round(600*(o.p.ar||1))),
      height: Math.round((o.p.ar||1) * 620),
      title: o.p.title,
      _idx: o.i
    }));
    if(window.__mountProjMasonry) window.__mountProjMasonry(gridEl, mItems, (it)=> openItem(it._idx));
  });

  // Tabs sub-halaman tech / art → tampilkan pane
  const tabs = [...root.querySelectorAll('.ptab')];
  const panes = [...root.querySelectorAll('.cat-pane')];
  tabs.forEach(tab => tab.addEventListener('click', () => {
    tabs.forEach(x => x.classList.remove('active'));
    tab.classList.add('active');
    panes.forEach(pn => { pn.style.display = (pn.dataset.pane === tab.dataset.cat) ? '' : 'none'; });
  }));

  // Sertifikat: loop tak berujung + momentum (drag lalu berputar lama, licin)
  const track = root.querySelector('.cert-track');
  if(track){
    let oneSet = 0;
    const measure = () => { oneSet = track.scrollWidth / 3; if(oneSet > 0 && track.scrollLeft < 1) track.scrollLeft = oneSet; };
    requestAnimationFrame(measure);
    const wrap = () => {
      if(!oneSet) return;
      if(track.scrollLeft < oneSet * 0.5) track.scrollLeft += oneSet;
      else if(track.scrollLeft > oneSet * 1.5) track.scrollLeft -= oneSet;
    };
    let down = false, moved = false, startX = 0, startLeft = 0, lastX = 0, vel = 0, momRaf = null;
    const stopMom = () => { if(momRaf){ cancelAnimationFrame(momRaf); momRaf = null; } };
    track.addEventListener('pointerdown', (e) => {
      measure(); down = true; moved = false; startX = e.clientX; startLeft = track.scrollLeft; lastX = e.clientX; vel = 0;
      stopMom(); track.classList.add('dragging'); track.setPointerCapture(e.pointerId);
    });
    track.addEventListener('pointermove', (e) => {
      if(!down) return;
      const dx = e.clientX - startX;
      if(Math.abs(dx) > 4) moved = true;
      track.scrollLeft = startLeft - dx;
      vel = -(e.clientX - lastX); lastX = e.clientX;
      wrap();
    });
    const release = (e) => {
      if(!down) return;
      down = false; track.classList.remove('dragging'); try{ track.releasePointerCapture(e.pointerId); }catch(_){}
      (function mom(){
        if(!track.isConnected || Math.abs(vel) < 0.12){ momRaf = null; return; }
        track.scrollLeft += vel; wrap();
        vel *= 0.972;                 // gesekan kecil → berputar lama & licin
        momRaf = requestAnimationFrame(mom);
      })();
    };
    track.addEventListener('pointerup', release);
    track.addEventListener('pointercancel', release);
    track.addEventListener('wheel', (e) => {
      if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){ stopMom(); track.scrollLeft += e.deltaY; wrap(); e.preventDefault(); }
    }, { passive: false });
    [...track.querySelectorAll('.cert-item')].forEach(card => {
      card.addEventListener('click', () => {
        if(moved) return;
        const ct = (c.certificates||[])[+card.dataset.ci]; if(!ct) return;
        if(ct.url && ct.url.trim()){ window.open(ct.url, '_blank', 'noopener'); return; }
        openModal({ title:ct.title, desc:(ct.issuer? ('Issued by ' + ct.issuer) : ''), images:[ct.image], palette:{ bg:'#141414', fg:'#E7B996' } });
      });
    });
  }

  // Efek Chroma (grayscale → warna asli di sekitar kursor) — hanya layer utama
  if(root.id === 'baseLayer'){
    const gray = root.querySelector('.proj-gray');
    const fade = root.querySelector('.proj-gray .chroma-fade');
    const page = root.querySelector('.page.projects');
    if(gray && page){
      let tx = W/2, ty = H/2, cx = tx, cy = ty, seen = false;
      const onMove = (e) => {
        const r = page.getBoundingClientRect();
        tx = e.clientX - r.left; ty = e.clientY - r.top;
        if(!seen){ cx = tx; cy = ty; seen = true; }
        if(fade) fade.style.opacity = '0';
      };
      page.addEventListener('pointermove', onMove);
      page.addEventListener('pointerleave', () => { if(fade) fade.style.opacity = '1'; });
      (function loop(){
        if(!gray.isConnected) return;
        cx += (tx - cx) * 0.16; cy += (ty - cy) * 0.16;
        gray.style.setProperty('--x', cx + 'px');
        gray.style.setProperty('--y', cy + 'px');
        requestAnimationFrame(loop);
      })();
    }
  }
}

/* Pecah teks jadi span per-huruf (word-wrap tetap terjaga) untuk efek proximity */
function proxWrap(el, text, base){
  el.textContent = '';
  const words = String(text).split(' ');
  words.forEach((w, wi) => {
    const wspan = document.createElement('span');
    wspan.style.display = 'inline-block';
    wspan.style.whiteSpace = 'nowrap';
    for(const ch of w){
      const s = document.createElement('span');
      s.className = 'prox';
      s.style.display = 'inline-block';
      s.dataset.base = base;
      s.textContent = ch;
      wspan.appendChild(s);
    }
    el.appendChild(wspan);
    if(wi < words.length - 1) el.appendChild(document.createTextNode(' '));
  });
}

/* Loop: tiap huruf yang dekat kursor berat font-nya naik menuju 900 */
function startProximity(root){
  const myTok = proxToken;
  const RADIUS = 130;
  const cursor = { x: -9999, y: -9999 };
  let cache = [];
  const recompute = () => {
    cache = [];
    root.querySelectorAll('.prox').forEach(el => {
      const r = el.getBoundingClientRect();
      cache.push({ el, cx: r.left + r.width/2, cy: r.top + r.height/2, base: +el.dataset.base || 400 });
    });
  };
  root._proxRecompute = recompute;
  const mm = e => { cursor.x = e.clientX; cursor.y = e.clientY; };
  const rs = () => recompute();
  window.addEventListener('mousemove', mm);
  window.addEventListener('resize', rs);
  recompute();
  (function loop(){
    if(myTok !== proxToken){
      window.removeEventListener('mousemove', mm);
      window.removeEventListener('resize', rs);
      return;
    }
    for(let i = 0; i < cache.length; i++){
      const L = cache[i];
      const d = Math.hypot(cursor.x - L.cx, cursor.y - L.cy);
      const norm = d < RADIUS ? (1 - d/RADIUS) : 0;
      const t = Math.pow(norm, 0.55);          // kurva lebih tajam → zona tebal lebih luas
      const w = (L.base + (900 - L.base) * t) | 0;
      L.el.style.fontVariationSettings = `'wght' ${w}`;
    }
    requestAnimationFrame(loop);
  })();
}

function initContact(root){

    e.preventDefault();

    const endpoint = CONFIG.contact.formEndpoint;
    if(!endpoint || !endpoint.trim()){
      const subject = encodeURIComponent(`Portfolio message from ${data.name}`);
      const body = encodeURIComponent(`${data.message}\n\n— ${data.name} (${data.email})`);
      window.location.href = `mailto:${CONFIG.contact.email}?subject=${subject}&body=${body}`;
      note.textContent = "Opening your email app…"; note.className = "note ok"; return;
    }
    try {
      btn.disabled = true; if(lbl) lbl.textContent = "Sending…";

    finally { btn.disabled = false; if(lbl) lbl.textContent = "Send"; }
  });

/* =====================================================================
   LIQUID SWIPE ENGINE
   ===================================================================== */
const baseLayer = document.getElementById('baseLayer');
const topLayer  = document.getElementById('topLayer');   // L: halaman berikutnya (maju)
const topLayerR = document.getElementById('topLayerR');  // R: halaman sebelumnya (mundur)
const blobPathL = document.getElementById('blobPath');
const blobPathR = document.getElementById('blobPathR');
const swipeBtn  = document.getElementById('swipeBtn');
const edgeBack  = document.getElementById('edgeBack');
let H = window.innerHeight, W = window.innerWidth;
let MOBILE = window.matchMedia('(max-width: 820px)').matches;

/* Blob KIRI / ATAS (maju) */
function getPath(y, x, w){
  const A = 200 + x * 0.5, C = A - 60;
  return `M0,${H} H0 V0 h${w} v${y - A} c0,${C},${x},${C},${x},${A} S${w},${y},${w},${y + A*2} V${H} z`;
}
function getPathV(xp, d, h){
  const A = 200 + d * 0.5, C = A - 60;
  return `M${W},0 L0,0 L0,${h} L${xp - A},${h} C${xp - A + C},${h} ${xp - A + C},${h + d} ${xp},${h + d} S${xp},${h} ${xp + A*2},${h} L${W},${h} Z`;
}
/* Blob KANAN / BAWAH (mundur) — cermin dari yang di atas */
function getPathRight(y, x, w){
  const A = 200 + x * 0.5, C = A - 60;
  return `M${W},${H} H${W} V0 h${-w} v${y - A} c0,${C},${-x},${C},${-x},${A} S${W - w},${y},${W - w},${y + A*2} V${H} z`;
}
function getPathVBottom(xp, d, h){
  const A = 200 + d * 0.5, C = A - 60;
  return `M${W},${H} L0,${H} L0,${H - h} L${xp - A},${H - h} C${xp - A + C},${H - h} ${xp - A + C},${H - h - d} ${xp},${H - h - d} S${xp},${H - h} ${xp + A*2},${H - h} L${W},${H - h} Z`;
}
function buildPathL(p, d, t){ return MOBILE ? getPathV(p, d, t) : getPath(p, d, t); }
function buildPathR(p, d, t){ return MOBILE ? getPathVBottom(p, d, t) : getPathRight(p, d, t); }
function drawLrest(){  blobPathL.setAttribute('d', buildPathL(restPos(), 48, 5)); }
function drawLgone(){  blobPathL.setAttribute('d', buildPathL(restPos(), 0, 0)); }
function drawRempty(){ blobPathR.setAttribute('d', buildPathR(restPos(), 0, 0)); }

function fullLen(){ return MOBILE ? H : W; }
function restPos(){ return MOBILE ? W * 0.5 : H * 0.72; }
function restBtn(){ return MOBILE ? { x: W * 0.5 - 23, y: 7 } : { x: 7, y: H * 0.72 - 20 }; }

function mk(v){ return { v:v, vel:0, t:v }; }
const CFG_LIQUID = { t:170, f:26, m:3 };   // saat menarik (rasa liquid)
const CFG_CLOSE  = { t:200, f:30, m:1.3 }; // saat menutup (dipercepat)
const CFG_SNAP   = { t:300, f:30, m:1 };   // saat intro/return (siap kilat)
function step(s, dt, cfg){
  const a = (-cfg.t*(s.v - s.t) - cfg.f*s.vel) / cfg.m;
  s.vel += a*dt; s.v += s.vel*dt;
}
function settled(s){ return Math.abs(s.v - s.t) < 0.5 && Math.abs(s.vel) < 0.6; }

const state = {
  base: 0,
  active: 'L', dir: 'fwd',
  phase: 'intro', committed: false,
  py: mk(restPos()), px: mk(0), pw: mk(0),
  bx: mk(-70), by: mk(0),
  dragStart: 0, curPrimary: 0, curCross: 0,
  raf: null, lastRAF: 0
};
const isClosing = () => state.phase === 'close1' || state.phase === 'close2';

function setIntroTargets(){
  const b = restBtn();
  state.py.t = restPos(); state.px.t = 48; state.pw.t = 5;
  state.bx.t = b.x; state.by.t = b.y;
}
function preIntro(){
  const b = restBtn();
  state.py.v = restPos(); state.py.vel = 0;
  state.px.v = 0; state.px.vel = 0;
  state.pw.v = 0; state.pw.vel = 0;
  state.bx.v = b.x; state.bx.vel = 0;   // tombol LANGSUNG di posisi diam -> bisa langsung ditarik
  state.by.v = b.y; state.by.vel = 0;
}
function draw(){
  const dpath = (state.active === 'L' ? buildPathL : buildPathR)(state.py.v, state.px.v, state.pw.v);
  (state.active === 'L' ? blobPathL : blobPathR).setAttribute('d', dpath);
  swipeBtn.style.transform = `translate(${state.bx.v}px, ${state.by.v}px)`;
  const prog = MOBILE ? state.by.v : state.bx.v;
  swipeBtn.style.opacity = Math.max(0, Math.min(1, (140 - prog) / 100));
  swipeBtn.style.display = (isClosing() || state.active !== 'L') ? 'none' : 'flex';
}
function loop(now){
  const dt = Math.min((now - (state.lastRAF || now)) / 1000, 0.032) || 0.016;
  state.lastRAF = now;
  const scal = [state.py, state.px, state.pw, state.bx, state.by];
  const cfg = (state.phase === 'close1' || state.phase === 'close2') ? CFG_CLOSE
            : (state.phase === 'intro'  || state.phase === 'return') ? CFG_SNAP
            : CFG_LIQUID;
  const sub = 2, sdt = dt / sub;
  for(let i=0;i<sub;i++) scal.forEach(s => step(s, sdt, cfg));
  draw();

  if(state.phase === 'close1'){
    if(Math.abs(state.pw.v - fullLen()) < 8 && Math.abs(state.pw.vel) < 40){ state.phase = 'close2'; state.px.t = 0; }
    state.raf = requestAnimationFrame(loop); return;
  }
  if(state.phase === 'close2'){
    if(Math.abs(state.px.v) < 2 && Math.abs(state.px.vel) < 6){ doSwap(); }
    state.raf = requestAnimationFrame(loop); return;
  }
  if(state.phase === 'drag'){ state.raf = requestAnimationFrame(loop); return; }
  if((state.phase === 'intro' || state.phase === 'return') && scal.every(settled)){
    if(state.restoreL && state.active === 'R'){
      // batal swipe-mundur → kembalikan pegangan maju (kiri) + tombol '>'
      state.restoreL = false;
      state.active = 'L'; state.dir = 'fwd';
      drawRempty();
      const b = restBtn();
      state.py.v = state.py.t = restPos();
      state.px.v = state.px.t = 48;
      state.pw.v = state.pw.t = 5;
      state.bx.v = state.bx.t = b.x;
      state.by.v = state.by.t = b.y;
      state.py.vel = state.px.vel = state.pw.vel = state.bx.vel = state.by.vel = 0;
      drawLrest(); draw();
    }
    state.phase = 'idle'; state.lastRAF = 0; state.raf = null; return;
  }
  state.raf = requestAnimationFrame(loop);
}
function ensureLoop(){ if(!state.raf){ state.lastRAF = 0; state.raf = requestAnimationFrame(loop); } }

function buildBase(idx){ document.body.dataset.page = PAGES[idx].key; document.body.dataset.lanyardUp = '0'; if(window.__unmountActivityStack) window.__unmountActivityStack(); if(window.__unmountProjExtras) window.__unmountProjExtras(); baseLayer.innerHTML = PAGES[idx].render(); stopTyping(); stopProx(); PAGES[idx].init && PAGES[idx].init(baseLayer); }
function buildTopL(idx){
  topLayer.innerHTML = PAGES[idx].render();
  PAGES[idx].init && PAGES[idx].init(topLayer);
  swipeBtn.style.borderColor = PAGES[idx].swipeBtn;
  swipeBtn.style.color = PAGES[idx].swipeBtn;
}
function buildTopR(idx){
  topLayerR.innerHTML = PAGES[idx].render();
  PAGES[idx].init && PAGES[idx].init(topLayerR);
}

function doSwap(){
  state.base = (state.dir === 'back') ? (state.base - 1 + N) % N : (state.base + 1) % N;
  buildBase(state.base);
  buildTopL((state.base + 1) % N);
  buildTopR((state.base - 1 + N) % N);
  state.active = 'L'; state.dir = 'fwd';
  drawRempty();
  preIntro(); setIntroTargets();
  state.phase = 'intro'; state.committed = false;
  draw();
  ensureLoop();
}
function commit(){
  if(state.committed) return;
  state.committed = true; state.phase = 'close1';
  state.py.t = state.curCross; state.px.t = -50; state.pw.t = fullLen();
  ensureLoop();
}

/* ---- mulai gerakan maju (pegangan kiri/atas) ---- */
function onDownFwd(e){
  if(state.phase === 'close1' || state.phase === 'close2' || state.phase === 'drag') return;
  if(state.active !== 'L'){                 // pindah dari mode mundur -> reset
    drawRempty();
    const b = restBtn();
    state.py.v = restPos(); state.px.v = 48; state.pw.v = 5;
    state.bx.v = b.x; state.by.v = b.y;
    state.py.vel = state.px.vel = state.pw.vel = state.bx.vel = state.by.vel = 0;
  } else if(state.phase === 'intro' || state.phase === 'return'){
    // ada niat menarik lagi -> selesaikan animasi masuk SEKETIKA
    setIntroTargets();
    ['py','px','pw','bx','by'].forEach(k => { state[k].v = state[k].t; state[k].vel = 0; });
  }
  state.active = 'L'; state.dir = 'fwd';
  beginDrag(e);
}
/* ---- mulai gerakan mundur (tepi kanan/bawah, tak terlihat) ---- */
function onDownBack(e){
  if(state.phase === 'close1' || state.phase === 'close2' || state.phase === 'drag') return;
  drawLrest();                              // bekukan pegangan kiri di posisi diam
  state.active = 'R'; state.dir = 'back';
  const cross = MOBILE ? e.clientX : e.clientY;
  state.py.v = cross; state.px.v = 0; state.pw.v = 0;
  state.py.vel = state.px.vel = state.pw.vel = 0;
  beginDrag(e);
}
function beginDrag(e){
  state.phase = 'drag'; state.committed = false;
  state.dragStart = MOBILE ? e.clientY : e.clientX;
  state.curPrimary = 0;
  state.curCross = MOBILE ? e.clientX : e.clientY;
  document.body.classList.add('dragging');
  const el = (state.active === 'L') ? swipeBtn : edgeBack;
  try { el.setPointerCapture(e.pointerId); } catch(_){}
  ensureLoop();
}
function onMove(e){
  if(state.phase !== 'drag' || state.committed) return;
  const axis = MOBILE ? e.clientY : e.clientX;
  const cross = MOBILE ? e.clientX : e.clientY;
  const primary = (state.dir === 'fwd') ? (axis - state.dragStart) : (state.dragStart - axis);
  state.curPrimary = primary; state.curCross = cross;
  state.py.t = cross; state.px.t = primary + 60; state.pw.t = 10;
  if(state.active === 'L'){
    if(MOBILE){ state.bx.t = cross - 23; state.by.t = primary + 7; }
    else      { state.bx.t = primary + 20; state.by.t = cross - 20; }
  }
  // Tarik lanyard ke atas begitu swipe meninggalkan halaman contact ≥25%
  if(document.body.dataset.page === 'contact'){
    document.body.dataset.lanyardUp = (primary / fullLen() >= 0.25) ? '1' : '0';
  }
  if(primary > fullLen() * 0.5) commit();
}
function onUp(e){
  if(state.phase !== 'drag') return;
  document.body.classList.remove('dragging');
  const el = (state.active === 'L') ? swipeBtn : edgeBack;
  try { el.releasePointerCapture(e.pointerId); } catch(_){}
  if(state.committed) return;
  if(state.curPrimary > fullLen() * 0.5) commit();
  else {
    document.body.dataset.lanyardUp = '0';   // batal → lanyard turun lagi
    // balik ke posisi diam (maju -> sliver, mundur -> kosong)
    if(state.active === 'L'){ setIntroTargets(); }
    else { state.py.t = state.curCross; state.px.t = 0; state.pw.t = 0; state.restoreL = true; }
    state.phase = 'return'; ensureLoop();
  }
}
swipeBtn.addEventListener('pointerdown', onDownFwd);
edgeBack.addEventListener('pointerdown', onDownBack);
window.addEventListener('pointermove', onMove);
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);

function applyMode(){
  MOBILE = window.matchMedia('(max-width: 820px)').matches;
  swipeBtn.classList.toggle('vert', MOBILE);
}

let rsz;
window.addEventListener('resize', () => {
  clearTimeout(rsz);
  rsz = setTimeout(() => {
    H = window.innerHeight; W = window.innerWidth;
    applyMode();
    if(state.phase === 'idle'){
      const b = restBtn();
      state.py.v = restPos(); state.py.t = restPos();
      state.px.v = 48; state.px.t = 48; state.pw.v = 5; state.pw.t = 5;
      state.bx.v = b.x; state.bx.t = b.x; state.by.v = b.y; state.by.t = b.y;
      state.active = 'L';
      drawRempty(); draw();
      if(PAGES[state.base].key === 'projects') buildBase(state.base);
    }
  }, 160);
});

/* =====================================================================
   SUPABASE — tarik konten dari database saat halaman dimuat.
   Kalau gagal / kosong, otomatis pakai konten default di CONFIG.
   ===================================================================== */
const SB_URL = 'https://hlmvvlqgtflrcjkwcufs.supabase.co';
const SB_KEY = 'sb_publishable_sDwxXxCoCeo_PVmr-0NbSA_epdrFiLk';
async function sbGet(path){
  const r = await fetch(SB_URL + '/rest/v1/' + path, {
    headers: { apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
  });
  if(!r.ok) throw new Error('supabase ' + r.status);
  return r.json();
}
function socialsToArr(obj){
  return obj ? Object.entries(obj).filter(([,v]) => v && String(v).trim()).map(([icon,url]) => ({ icon, url })) : [];
}
function parseMeta(s){
  if(!s) return [];
  return String(s).split(/[\n,]/).map(x => x.trim()).filter(Boolean).map(part => {
    const i = part.indexOf(':');
    return i >= 0 ? { k: part.slice(0,i).trim(), v: part.slice(i+1).trim() } : { k:'', v: part };
  });
}
async function loadFromSupabase(){
  const [profileArr, projects, certs, acts] = await Promise.all([
    sbGet('profile?id=eq.1&select=*'),
    sbGet('projects?select=*&order=sort.asc,created_at.asc'),
    sbGet('certificates?select=*&order=sort.asc,created_at.asc'),
    sbGet('activities?select=*&order=sort.asc,created_at.asc')
  ]);
  const P = (profileArr && profileArr[0]) || null;
  if(P){
    const h = CONFIG.home, c = CONFIG.contact, L = c.lanyard;
    if(P.name_line1) h.nameLine1 = P.name_line1;
    if(P.name_line2) h.nameLine2 = P.name_line2;
    if(P.roles && P.roles.length) h.roles = P.roles;
    if(P.description) h.description = P.description;
    if(P.copyright) h.copyright = P.copyright;
    if(P.home_photo_url) h.photo = P.home_photo_url;
    if(P.cv_url) h.cvUrl = P.cv_url;
    if(P.email) c.email = P.email;
    if(P.socials){
      const g = socialsToArr(P.socials.general), t = socialsToArr(P.socials.tech), a = socialsToArr(P.socials.art);
      if(g.length) c.general = g;
      if(t.length) c.tech = t;
      if(a.length) c.art = a;
    }
    if(P.lanyard_name) L.card.name = P.lanyard_name;
    if(P.lanyard_role) L.card.role = P.lanyard_role;
    if(P.lanyard_photo_url) L.card.photo = P.lanyard_photo_url;
    if(P.lanyard_band_url) L.bandImage = P.lanyard_band_url;
    if(P.lanyard_front_url) L.frontImage = P.lanyard_front_url;
    if(P.lanyard_back_url) L.backImage = P.lanyard_back_url;
  }
  if(projects && projects.length){
    CONFIG.projects.items = projects.map(r => ({
      title:r.title||'', cat:r.cat||'tech', feature:!!r.feature, ar:Number(r.ar)||1,
      cover:r.cover_url||'', tags:r.tags||[], description:r.description||'', images:r.images||[]
    }));
  }
  if(certs && certs.length){
    CONFIG.projects.certificates = certs.map(r => ({
      title:r.title||'', issuer:r.issuer||'', image:r.image_url||'', url:r.url||''
    }));
  }
  if(acts && acts.length){
    CONFIG.activity.items = acts.map(r => ({
      title:r.title||'', text:r.text||'', meta:parseMeta(r.meta), photo:r.photo_url||'',
      modalTitle:r.modal_title||r.title||'', modalDesc:r.modal_desc||'', gallery:r.gallery||[]
    }));
  }
}

/* START */
window.LANYARD_CONFIG = CONFIG.contact.lanyard; // default sinkron untuk React (di-update setelah fetch)

(async function boot(){
  try { await loadFromSupabase(); }
  catch(e){ console.warn('Supabase gagal dimuat, pakai konten default:', e); }

  // segarkan data turunan setelah konten final
  window.LANYARD_CONFIG = CONFIG.contact.lanyard;
  window.__activityImages = activityImagesPerItem();
  window.dispatchEvent(new Event('app-data-ready'));
  window.dispatchEvent(new Event('lanyard-config-updated'));

  applyMode();
  buildBase(0);
  buildTopL(1);
  buildTopR((0 - 1 + N) % N);
  drawRempty();
  preIntro(); setIntroTargets(); draw(); ensureLoop();
})();
</script>
